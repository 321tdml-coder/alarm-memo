
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アラームメモ</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        input, textarea, button { width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background: #ff4757; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { background: #ff6b81; transform: scale(0.98); }
        .list-item { background: #fff; padding: 10px; margin-top: 10px; border-left: 5px solid #ff4757; border-radius: 4px; width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⏰ アラームメモ</h2>
        <input type="time" id="alarmTime">
        <textarea id="alarmMemo" placeholder="その時、何をする？" rows="3"></textarea>
        <button onclick="setAlarm()">音声を有効化して予約</button>
    </div>
    <div id="alarmList" style="width: 100%; max-width: 400px;"></div>

    <script>
        let alarms = [];
        let audioContext;

        function setAlarm() {
            // iPhoneの音声を解放
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const b = audioContext.createBuffer(1, 1, 22050);
                const s = audioContext.createBufferSource();
                s.buffer = b; s.connect(audioContext.destination); s.start(0);
            }

            const time = document.getElementById('alarmTime').value;
            const memo = document.getElementById('alarmMemo').value;
            
            if (!time) {
                alert("時間を入力してください");
                return;
            }

            const alarm = { time, memo, id: Date.now() };
            alarms.push(alarm);
            updateDisplay();
            document.getElementById('alarmMemo').value = "";
            alert("予約完了！画面を閉じずに待機してください。");
        }

        function updateDisplay() {
            const container = document.getElementById('alarmList');
            container.innerHTML = alarms.map(a => `
                <div class="list-item">
                    <span><b>${a.time}</b>: ${a.memo}</span>
                    <button onclick="removeAlarm(${a.id})" style="width:auto; margin:0; padding:5px 10px; background:#ccc; font-size:12px;">削除</button>
                </div>
            `).join('');
        }

        function removeAlarm(id) {
            alarms = alarms.filter(a => a.id !== id);
            updateDisplay();
        }

        setInterval(() => {
            const now = new Date();
            const current = now.getHours().toString().padStart(2, '0') + ":" + 
                            now.getMinutes().toString().padStart(2, '0');
            
            alarms.forEach((a, index) => {
                if (a.time === current) {
                    // ビープ音再生
                    const o = audioContext.createOscillator();
                    const g = audioContext.createGain();
                    o.connect(g); g.connect(audioContext.destination);
                    o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 2);
                    o.stop(audioContext.currentTime + 2);

                    alert("【時間です！】\n" + a.memo);
                    alarms.splice(index, 1);
                    updateDisplay();
                }
            });
        }, 1000);
    </script>
</body>
</html>
